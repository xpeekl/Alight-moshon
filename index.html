<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MotionFree Pro - Alight & Blurrr Studio</title>
  <style>
    :root {
      --bg-main: #0c0d10;
      --bg-panel: #14161d;
      --bg-card: #1c1f2b;
      --bg-hover: #262a3a;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #222634;
      --timeline-bg: #101218;
      --timeline-clip: #252a3b;
      --timeline-clip-active: #10b981;
      --playhead: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      position: fixed;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* HOME SCREEN */
    #home-screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      z-index: 100;
      padding: 16px;
      overflow-y: auto;
    }

    .home-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .home-logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .banner-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .banner-card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .banner-card p {
      font-size: 11px;
      color: var(--text-sub);
    }

    .btn-primary-pill {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }

    .home-tabs {
      display: flex;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
    }

    .home-tab {
      padding-bottom: 8px;
      color: var(--text-sub);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .home-tab.active {
      color: var(--text-main);
      border-bottom-color: var(--accent-green);
    }

    .projects-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .project-item {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .project-thumb-box {
      width: 50px;
      height: 50px;
      background: var(--bg-card);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .project-info h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .project-info p {
      font-size: 10px;
      color: var(--text-sub);
    }

    /* MODAL CREAR PROYECTO */
    #create-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: flex-end;
    }

    .modal-content {
      background: var(--bg-panel);
      width: 100%;
      max-height: 85vh;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
    }

    .form-group input, .form-group select {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .aspect-ratios {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .ratio-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .ratio-btn.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
    }

    .btn-create-final {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
    }

    /* EDITOR SCREEN */
    #editor-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .editor-header {
      height: 48px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .icon-btn:active {
      background: var(--bg-hover);
    }

    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 4px;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* CONTROLES FLOTANTES / WAYPOINTS ALIGHT MOTION */
    .waypoint-bar {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 30;
      background: rgba(20, 22, 29, 0.85);
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(8px);
    }

    .waypoint-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--accent-green);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .waypoint-btn:active {
      background: var(--accent-green);
      color: #000;
    }

    .timeline-container {
      height: 190px;
      background: var(--timeline-bg);
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-color);
      position: relative;
    }

    .timeline-toolbar {
      height: 38px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .time-code {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-sub);
    }

    .timeline-tracks {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      position: relative;
      padding: 10px 0;
      cursor: pointer;
    }

    .playhead-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0px;
      width: 2px;
      background: var(--playhead);
      z-index: 20;
      pointer-events: none;
    }

    .playhead-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: -4px;
      width: 10px;
      height: 8px;
      background: var(--playhead);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .track {
      height: 40px;
      background: rgba(255,255,255,0.02);
      border-radius: 4px;
      margin-bottom: 6px;
      position: relative;
      width: 2000px;
    }

    .clip {
      position: absolute;
      height: 100%;
      background: var(--timeline-clip);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .clip.active {
      border-color: var(--accent-green);
      background: var(--timeline-clip-active);
      color: #000;
    }

    .controls-panel {
      height: 180px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .control-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-main);
    }

    .tab-btn {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background: transparent;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      color: var(--accent-green);
      border-bottom: 2px solid var(--accent-green);
    }

    .tab-content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-group label {
      display: block;
      font-size: 10px;
      color: var(--text-sub);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .slider {
      width: 100%;
      -webkit-appearance: none;
      background: var(--bg-card);
      height: 4px;
      border-radius: 2px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-green);
      cursor: pointer;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .action-btn:active {
      background: var(--bg-hover);
    }

    .floating-add-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: var(--accent-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      cursor: pointer;
      z-index: 50;
    }

    video {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="home-top-bar">
      <div class="home-logo">Alight Motion Pro</div>
      <button class="icon-btn" style="color:var(--accent-green);">Perfil</button>
    </div>

    <div class="banner-card">
      <div>
        <h3>Explorar plantillas</h3>
        <p>Empieza con más de 1,000 plantillas listas para usar</p>
      </div>
      <button class="btn-primary-pill" onclick="alert('Explorador de plantillas')">Ver</button>
    </div>

    <div class="home-tabs">
      <div class="home-tab active">Proyectos</div>
      <div class="home-tab" onclick="alert('Tus plantillas')">Tus plantillas</div>
      <div class="home-tab" onclick="alert('Elementos')">Elementos</div>
    </div>

    <div class="projects-grid" id="projects-grid"></div>
  </div>

  <!-- MODAL CREAR PROYECTO -->
  <div id="create-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Nuevo Proyecto</span>
        <button class="icon-btn" onclick="closeCreateModal()">✕</button>
      </div>
      <div class="form-group">
        <label>Nombre del proyecto</label>
        <input type="text" id="proj-name-input" value="Proyecto 1">
      </div>
      <div class="form-group">
        <label>Relación de aspecto</label>
        <div class="aspect-ratios">
          <div class="ratio-btn active" onclick="setRatio(this, '16:9')">16:9</div>
          <div class="ratio-btn" onclick="setRatio(this, '9:16')">9:16</div>
          <div class="ratio-btn" onclick="setRatio(this, '1:1')">1:1</div>
          <div class="ratio-btn" onclick="setRatio(this, '4:3')">4:3</div>
        </div>
      </div>
      <div class="form-group">
        <label>Resolución</label>
        <select id="proj-res">
          <option value="1080">1080p (FHD)</option>
          <option value="720">720p (HD)</option>
          <option value="480">480p (SD)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Cuadros por segundo</label>
        <select id="proj-fps">
          <option value="60">60 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="24">24 fps</option>
        </select>
      </div>
      <button class="btn-create-final" onclick="confirmCreateProject()">Crear proyecto</button>
    </div>
  </div>

  <!-- EDITOR SCREEN -->
  <div id="editor-screen">
    <div class="editor-header">
      <button class="icon-btn" onclick="exitToHome()">VOLVER</button>
      <div style="font-size: 12px; font-weight: 600;" id="project-title-display">Proyecto</div>
      <button class="icon-btn" onclick="exportVideo()" style="color: var(--accent-green);">EXPORTAR</button>
    </div>

    <div class="preview-container">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
      </div>

      <!-- BOTÓN DE KEYFRAMES / WAYPOINTS ESTILO ALIGHT MOTION -->
      <div class="waypoint-bar">
        <button class="waypoint-btn" onclick="addWaypoint()" title="Añadir Keyframe">◆</button>
      </div>
    </div>

    <div class="timeline-container">
      <div class="timeline-toolbar">
        <button class="icon-btn" id="play-btn" onclick="togglePlay()">PLAY</button>
        <div class="time-code" id="time-display">00:00.00</div>
        <button class="icon-btn" onclick="triggerFileInput()">+ MEDIA</button>
      </div>
      <div class="timeline-tracks" id="timeline-tracks" onclick="seekTimeline(event)">
        <div class="playhead-line" id="playhead-line"></div>
        <div class="track" id="video-track"></div>
        <div class="track" id="audio-track"></div>
        <div class="track" id="shapes-track"></div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="control-tabs">
        <button class="tab-btn active" onclick="switchTab('edit')">Edición</button>
        <button class="tab-btn" onclick="switchTab('shapes')">Formas</button>
        <button class="tab-btn" onclick="switchTab('effects')">Efectos Pro</button>
        <button class="tab-btn" onclick="switchTab('twixtor')">Twixtor</button>
        <button class="tab-btn" onclick="switchTab('transform')">Transformar</button>
      </div>

      <div class="tab-content active" id="tab-edit">
        <div class="btn-grid">
          <div class="action-btn" onclick="splitClip()">SEPARAR</div>
          <div class="action-btn" onclick="extractAudio()">EXTRAER AUDIO</div>
          <div class="action-btn" onclick="duplicateClip()">DUPLICAR</div>
          <div class="action-btn" onclick="deleteSelectedElement()">ELIMINAR</div>
        </div>
      </div>

      <div class="tab-content" id="tab-shapes">
        <div class="btn-grid">
          <div class="action-btn" onclick="addShape('rect')">RECTÁNGULO</div>
          <div class="action-btn" onclick="addShape('circle')">CÍRCULO</div>
          <div class="action-btn" onclick="addShape('star')">ESTRELLA</div>
          <div class="action-btn" onclick="addText()">TEXTO</div>
        </div>
      </div>

      <div class="tab-content" id="tab-effects">
        <div class="control-group">
          <label>Desenfoque (Blur)</label>
          <input type="range" class="slider" min="0" max="20" value="0" id="effect-blur" oninput="updateEffects()">
        </div>
        <div class="control-group">
          <label>Brillo</label>
          <input type="range" class="slider" min="50" max="150" value="100" id="effect-brightness" oninput="updateEffects()">
        </div>
        <div class="control-group">
          <label>Contraste</label>
          <input type="range" class="slider" min="50" max="150" value="100" id="effect-contrast" oninput="updateEffects()">
        </div>
        <div class="control-group">
          <label>Saturación</label>
          <input type="range" class="slider" min="0" max="200" value="100" id="effect-saturate" oninput="updateEffects()">
        </div>
      </div>

      <div class="tab-content" id="tab-twixtor">
        <div class="control-group">
          <label>Velocidad (Twixtor Frame Blending)</label>
          <input type="range" class="slider" min="0.1" max="2" step="0.05" value="1" id="speed-slider" oninput="updateSpeed()">
          <div style="font-size: 10px; color: var(--text-sub); margin-top: 4px;" id="speed-val">1.0x</div>
        </div>
      </div>

      <div class="tab-content" id="tab-transform">
        <div class="control-group">
          <label>Escala</label>
          <input type="range" class="slider" min="0.5" max="2" step="0.05" value="1" id="transform-scale" oninput="updateTransform()">
        </div>
        <div class="control-group">
          <label>Rotación</label>
          <input type="range" class="slider" min="-180" max="180" value="0" id="transform-rotate" oninput="updateTransform()">
        </div>
      </div>
    </div>
  </div>

  <div class="floating-add-btn" onclick="openCreateModal()">+</div>
</div>

<input type="file" id="file-input" accept="video/*" style="display:none;" onchange="handleFileSelect(event)">
<video id="hidden-video" playsinline webkit-playsinline></video>

<script>
  let projects = [];
  let currentProject = null;
  let isPlaying = false;
  let duration = 0;
  let animationFrameId = null;
  let shapes = [];
  let hasVideoLoaded = false;
  let hasAudioExtracted = false;
  let currentRatio = '16:9';
  let selectedElement = null; // 'video', 'audio' o índice de forma
  let keyframes = [];

  let clipData = {
    speed: 1.0,
    blur: 0,
    brightness: 100,
    contrast: 100,
    saturate: 100,
    scale: 1,
    rotate: 0
  };

  const video = document.getElementById('hidden-video');
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  const bufferCanvas = document.createElement('canvas');
  const bufferCtx = bufferCanvas.getContext('2d');

  video.addEventListener('webkitbeginfullscreen', (e) => e.preventDefault());
  video.addEventListener('webkitendfullscreen', (e) => e.preventDefault());

  function init() {
    loadProjects();
    renderHome();
  }

  function loadProjects() {
    const saved = localStorage.getItem('am_projects');
    projects = saved ? JSON.parse(saved) : [{ id: '1', name: 'Proyecto 01', ratio: '16:9', date: 'Hoy' }];
  }

  function saveProjects() {
    localStorage.setItem('am_projects', JSON.stringify(projects));
  }

  function renderHome() {
    const grid = document.getElementById('projects-grid');
    grid.innerHTML = '';
    projects.forEach(p => {
      const item = document.createElement('div');
      item.className = 'project-item';
      item.onclick = () => openProject(p);
      item.innerHTML = `
        <div class="project-thumb-box">${p.ratio}</div>
        <div class="project-info">
          <h4>${p.name}</h4>
          <p>Creado: ${p.date} • 30fps</p>
        </div>
      `;
      grid.appendChild(item);
    });
  }

  function openCreateModal() {
    document.getElementById('create-modal').style.display = 'flex';
  }

  function closeCreateModal() {
    document.getElementById('create-modal').style.display = 'none';
  }

  function setRatio(el, ratio) {
    document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentRatio = ratio;
  }

  function confirmCreateProject() {
    const name = document.getElementById('proj-name-input').value || 'Proyecto nuevo';
    const newProj = {
      id: Date.now().toString(),
      name: name,
      ratio: currentRatio,
      date: 'Hoy'
    };
    projects.push(newProj);
    saveProjects();
    closeCreateModal();
    openProject(newProj);
  }

  function openProject(p) {
    currentProject = p;
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('editor-screen').style.display = 'flex';
    document.getElementById('project-title-display').innerText = p.name;
    document.querySelector('.floating-add-btn').style.display = 'none';
    resizeCanvas();
  }

  function exitToHome() {
    pause();
    document.getElementById('editor-screen').style.display = 'none';
    document.getElementById('home-screen').style.display = 'flex';
    document.querySelector('.floating-add-btn').style.display = 'flex';
    renderHome();
  }

  function resizeCanvas() {
    const wrapper = document.getElementById('canvas-wrapper');
    const container = document.querySelector('.preview-container');
    const h = container.clientHeight - 20;
    let w = (h * 9) / 16;
    if (currentProject && currentProject.ratio === '1:1') w = h;
    if (currentProject && currentProject.ratio === '16:9') w = (h * 16) / 9;

    wrapper.style.width = `${w}px`;
    wrapper.style.height = `${h}px`;
    canvas.width = w * 2;
    canvas.height = h * 2;
    bufferCanvas.width = canvas.width;
    bufferCanvas.height = canvas.height;
  }

  function triggerFileInput() {
    document.getElementById('file-input').click();
  }

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
    video.onloadedmetadata = () => {
      duration = video.duration;
      hasVideoLoaded = true;
      renderTimelineClips();
      selectElement('video');
      renderFrame();
    };
  }

  function renderTimelineClips() {
    const videoTrack = document.getElementById('video-track');
    videoTrack.innerHTML = '';
    if (hasVideoLoaded) {
      const clip = document.createElement('div');
      clip.className = `clip ${selectedElement === 'video' ? 'active' : ''}`;
      clip.style.width = `${Math.max(duration * 40, 200)}px`;
      clip.innerText = "Video Clip";
      clip.onclick = (ev) => { ev.stopPropagation(); selectElement('video'); };
      videoTrack.appendChild(clip);
    }

    const audioTrack = document.getElementById('audio-track');
    audioTrack.innerHTML = '';
    if (hasAudioExtracted) {
      const aClip = document.createElement('div');
      aClip.className = `clip ${selectedElement === 'audio' ? 'active' : ''}`;
      aClip.style.width = `${Math.max(duration * 40, 200)}px`;
      aClip.innerText = "Pista de Audio";
      aClip.onclick = (ev) => { ev.stopPropagation(); selectElement('audio'); };
      audioTrack.appendChild(aClip);
    }

    const shapesTrack = document.getElementById('shapes-track');
    shapesTrack.innerHTML = '';
    shapes.forEach((s, idx) => {
      const sClip = document.createElement('div');
      sClip.className = `clip ${selectedElement === idx ? 'active' : ''}`;
      sClip.style.width = `150px`;
      sClip.style.left = `${idx * 160}px`;
      sClip.innerText = s.type.toUpperCase();
      sClip.onclick = (ev) => { ev.stopPropagation(); selectElement(idx); };
      shapesTrack.appendChild(sClip);
    });
  }

  function selectElement(el) {
    selectedElement = el;
    renderTimelineClips();
  }

  function togglePlay() {
    if (!hasVideoLoaded) return;
    if (isPlaying) pause(); else play();
  }

  function play() {
    isPlaying = true;
    document.getElementById('play-btn').innerText = 'PAUSE';
    video.playbackRate = clipData.speed;
    video.play();
    loop();
  }

  function pause() {
    isPlaying = false;
    document.getElementById('play-btn').innerText = 'PLAY';
    video.pause();
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
  }

  function loop() {
    if (!isPlaying) return;
    renderFrame();
    updateTimeDisplay();
    updatePlayheadPosition();
    if (video.ended) {
      pause();
      video.currentTime = 0;
    }
    animationFrameId = requestAnimationFrame(loop);
  }

  function seekTimeline(e) {
    if (!hasVideoLoaded || duration === 0) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const totalWidth = 2000;
    const percentage = Math.max(0, Math.min(1, clickX / totalWidth));
    video.currentTime = percentage * duration;
    renderFrame();
    updateTimeDisplay();
    updatePlayheadPosition();
  }

  function updatePlayheadPosition() {
    if (!hasVideoLoaded || duration === 0) return;
    const totalWidth = 2000;
    const percentage = video.currentTime / duration;
    const playheadX = percentage * totalWidth;
    document.getElementById('playhead-line').style.left = `${playheadX}px`;
  }

  function renderFrame() {
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (hasVideoLoaded && video.videoWidth) {
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(clipData.scale, clipData.scale);
      ctx.rotate((clipData.rotate * Math.PI) / 180);

      ctx.filter = `blur(${clipData.blur}px) brightness(${clipData.brightness}%) contrast(${clipData.contrast}%) saturate(${clipData.saturate}%)`;

      if (clipData.speed < 1.0) {
        bufferCtx.globalAlpha = 0.4;
        bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
        ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        ctx.globalAlpha = 0.3;
        ctx.drawImage(bufferCanvas, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
      } else {
        ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        bufferCtx.globalAlpha = 1.0;
        bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
      }
    }
    ctx.restore();

    shapes.forEach(s => {
      ctx.save();
      ctx.fillStyle = '#10b981';
      if (s.type === 'rect') {
        ctx.fillRect(canvas.width / 4, canvas.height / 4, canvas.width / 2, canvas.height / 4);
      } else if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 80, 0, Math.PI * 2);
        ctx.fill();
      } else if (s.type === 'text') {
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TEXTO PRO', canvas.width / 2, canvas.height / 2);
      }
      ctx.restore();
    });
  }

  function updateTimeDisplay() {
    const cur = hasVideoLoaded ? video.currentTime : 0;
    const mins = Math.floor(cur / 60).toString().padStart(2, '0');
    const secs = Math.floor(cur % 60).toString().padStart(2, '0');
    const ms = Math.floor((cur % 1) * 100).toString().padStart(2, '0');
    document.getElementById('time-display').innerText = `${mins}:${secs}.${ms}`;
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
  }

  function updateSpeed() {
    const val = parseFloat(document.getElementById('speed-slider').value);
    clipData.speed = val;
    document.getElementById('speed-val').innerText = `${val.toFixed(2)}x`;
    if (isPlaying) video.playbackRate = val;
  }

  function updateEffects() {
    clipData.blur = document.getElementById('effect-blur').value;
    clipData.brightness = document.getElementById('effect-brightness').value;
    clipData.contrast = document.getElementById('effect-contrast').value;
    clipData.saturate = document.getElementById('effect-saturate').value;
    renderFrame();
  }

  function updateTransform() {
    clipData.scale = parseFloat(document.getElementById('transform-scale').value);
    clipData.rotate = parseFloat(document.getElementById('transform-rotate').value);
    renderFrame();
  }

  function addWaypoint() {
    if (!hasVideoLoaded) return;
    keyframes.push({ time: video.currentTime, scale: clipData.scale, rotate: clipData.rotate });
    alert(`Keyframe (Waypoint) añadido en el segundo ${video.currentTime.toFixed(2)}s`);
  }

  function extractAudio() {
    if (!hasVideoLoaded) {
      alert("Carga un video primero para extraer su audio.");
      return;
    }
    hasAudioExtracted = true;
    renderTimelineClips();
    alert("Audio extraído con éxito en una pista independiente.");
  }

  function addShape(type) {
    shapes.push({ type });
    selectElement(shapes.length - 1);
    renderFrame();
  }

  function addText() {
    shapes.push({ type: 'text' });
    selectElement(shapes.length - 1);
    renderFrame();
  }

  function splitClip() { 
    if (selectedElement === 'video') {
      alert("Clip de video separado en la línea de tiempo."); 
    } else {
      alert("Selecciona un elemento para separar.");
    }
  }

  function deleteSelectedElement() {
    if (selectedElement === 'video') {
      video.src = "";
      hasVideoLoaded = false;
      duration = 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      selectedElement = null;
    } else if (selectedElement === 'audio') {
      hasAudioExtracted = false;
      selectedElement = null;
    } else if (typeof selectedElement === 'number') {
      shapes.splice(selectedElement, 1);
      selectedElement = null;
      renderFrame();
    } else {
      alert("Selecciona un elemento en la línea de tiempo para eliminar.");
    }
    renderTimelineClips();
  }

  function duplicateClip() { 
    if (selectedElement === 'video') {
      alert("Clip de video duplicado en la pista.");
    } else if (typeof selectedElement === 'number') {
      const duplicated = { ...shapes[selectedElement] };
      shapes.push(duplicated);
      selectElement(shapes.length - 1);
      renderFrame();
    } else {
      alert("Selecciona un clip o forma para duplicar.");
    }
  }

  function exportVideo() { alert("Generando renderizado MP4 acelerado por hardware..."); }

  window.addEventListener('resize', resizeCanvas);
  window.onload = init;
</script>
</body>
</html>
