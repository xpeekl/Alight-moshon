<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MotionFree Pro - Studio</title>
  <style>
    :root {
      --bg-main: #0c0d10;
      --bg-panel: #14161d;
      --bg-card: #1c1f2b;
      --bg-hover: #262a3a;
      --accent-blue: #3b82f6;
      --accent-gray: #374151;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #222634;
      --timeline-bg: #101218;
      --timeline-clip: #252a3b;
      --timeline-clip-active: #3b82f6;
      --playhead: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      position: fixed;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* HOME SCREEN */
    #home-screen {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--bg-main);
      z-index: 100;
      padding: 20px;
    }

    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .home-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .btn-create {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
      padding-top: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .project-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .project-thumb {
      aspect-ratio: 9/16;
      background: var(--bg-card);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .project-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* EDITOR SCREEN */
    #editor-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .editor-header {
      height: 46px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .icon-btn:active {
      background: var(--bg-hover);
    }

    /* PREVIEW CONTAINER */
    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 4px;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* TIMELINE CONTAINER */
    .timeline-container {
      height: 200px;
      background: var(--timeline-bg);
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-color);
      position: relative;
    }

    .timeline-toolbar {
      height: 38px;
      background: var(--bg-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .time-code {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-sub);
    }

    .timeline-tracks {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      position: relative;
      padding: 10px 50vw;
    }

    .playhead {
      position: absolute;
      top: 38px;
      left: 50vw;
      width: 2px;
      height: calc(100% - 38px);
      background: var(--playhead);
      z-index: 10;
      pointer-events: none;
    }

    .playhead::before {
      content: '';
      position: absolute;
      top: 0;
      left: -4px;
      width: 10px;
      height: 8px;
      background: var(--playhead);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .track {
      height: 40px;
      background: rgba(255,255,255,0.02);
      border-radius: 4px;
      margin-bottom: 6px;
      position: relative;
      width: 2000px;
    }

    .clip {
      position: absolute;
      height: 100%;
      background: var(--timeline-clip);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .clip.active {
      border-color: var(--accent-blue);
      background: var(--timeline-clip-active);
    }

    /* CONTROL PANELS */
    .controls-panel {
      height: 170px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .control-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-main);
    }

    .tab-btn {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background: transparent;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      color: var(--text-main);
      border-bottom: 2px solid var(--accent-blue);
    }

    .tab-content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-group label {
      display: block;
      font-size: 10px;
      color: var(--text-sub);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .slider {
      width: 100%;
      -webkit-appearance: none;
      background: var(--bg-card);
      height: 4px;
      border-radius: 2px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .action-btn:active {
      background: var(--bg-hover);
    }

    video {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="home-header">
      <div class="home-title">Proyectos</div>
      <button class="btn-create" onclick="createNewProject()">+ Nuevo</button>
    </div>
    <div class="projects-grid" id="projects-grid"></div>
  </div>

  <!-- EDITOR SCREEN -->
  <div id="editor-screen">
    <div class="editor-header">
      <button class="icon-btn" onclick="exitToHome()">VOLVER</button>
      <div style="font-size: 12px; font-weight: 600;" id="project-title-display">Proyecto</div>
      <button class="icon-btn" onclick="exportVideo()" style="color: var(--accent-blue);">EXPORTAR</button>
    </div>

    <div class="preview-container">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
      </div>
    </div>

    <div class="timeline-container">
      <div class="timeline-toolbar">
        <button class="icon-btn" id="play-btn" onclick="togglePlay()">PLAY</button>
        <div class="time-code" id="time-display">00:00.00</div>
        <button class="icon-btn" onclick="triggerFileInput()">+ MEDIA</button>
      </div>
      <div class="playhead"></div>
      <div class="timeline-tracks" id="timeline-tracks">
        <div class="track" id="video-track"></div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="control-tabs">
        <button class="tab-btn active" onclick="switchTab('edit')">Edición</button>
        <button class="tab-btn" onclick="switchTab('shapes')">Formas</button>
        <button class="tab-btn" onclick="switchTab('effects')">Efectos</button>
        <button class="tab-btn" onclick="switchTab('twixtor')">Twixtor</button>
        <button class="tab-btn" onclick="switchTab('transform')">Transformar</button>
      </div>

      <!-- EDIT TAB -->
      <div class="tab-content active" id="tab-edit">
        <div class="btn-grid">
          <div class="action-btn" onclick="splitClip()">SEPARAR</div>
          <div class="action-btn" onclick="deleteClip()">ELIMINAR</div>
          <div class="action-btn" onclick="duplicateClip()">DUPLICAR</div>
          <div class="action-btn" onclick="triggerFileInput()">CARGAR</div>
        </div>
      </div>

      <!-- SHAPES TAB -->
      <div class="tab-content" id="tab-shapes">
        <div class="btn-grid">
          <div class="action-btn" onclick="addShape('rect')">RECTÁNGULO</div>
          <div class="action-btn" onclick="addShape('circle')">CÍRCULO</div>
          <div class="action-btn" onclick="addShape('star')">ESTRELLA</div>
          <div class="action-btn" onclick="addText()">TEXTO</div>
        </div>
      </div>

      <!-- EFFECTS TAB -->
      <div class="tab-content" id="tab-effects">
        <div class="control-group">
          <label>Desenfoque</label>
          <input type="range" class="slider" min="0" max="20" value="0" id="effect-blur" oninput="updateEffects()">
        </div>
        <div class="control-group">
          <label>Brillo</label>
          <input type="range" class="slider" min="50" max="150" value="100" id="effect-brightness" oninput="updateEffects()">
        </div>
        <div class="control-group">
          <label>Contraste</label>
          <input type="range" class="slider" min="50" max="150" value="100" id="effect-contrast" oninput="updateEffects()">
        </div>
      </div>

      <!-- TWIXTOR TAB -->
      <div class="tab-content" id="tab-twixtor">
        <div class="control-group">
          <label>Velocidad (Twixtor Blend)</label>
          <input type="range" class="slider" min="0.1" max="2" step="0.05" value="1" id="speed-slider" oninput="updateSpeed()">
          <div style="font-size: 10px; color: var(--text-sub); margin-top: 4px;" id="speed-val">1.0x</div>
        </div>
      </div>

      <!-- TRANSFORM TAB -->
      <div class="tab-content" id="tab-transform">
        <div class="control-group">
          <label>Escala</label>
          <input type="range" class="slider" min="0.5" max="2" step="0.05" value="1" id="transform-scale" oninput="updateTransform()">
        </div>
        <div class="control-group">
          <label>Rotación</label>
          <input type="range" class="slider" min="-180" max="180" value="0" id="transform-rotate" oninput="updateTransform()">
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept="video/*" style="display:none;" onchange="handleFileSelect(event)">
<video id="hidden-video" playsinline webkit-playsinline></video>

<script>
  let projects = [];
  let currentProject = null;
  let isPlaying = false;
  let duration = 0;
  let animationFrameId = null;
  let shapes = [];

  let clipData = {
    speed: 1.0,
    twixtor: true,
    blur: 0,
    brightness: 100,
    contrast: 100,
    scale: 1,
    rotate: 0
  };

  const video = document.getElementById('hidden-video');
  const canvas = document.getElementById('main-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  const bufferCanvas = document.createElement('canvas');
  const bufferCtx = bufferCanvas.getContext('2d');

  video.addEventListener('webkitbeginfullscreen', (e) => e.preventDefault());
  video.addEventListener('webkitendfullscreen', (e) => e.preventDefault());

  function init() {
    loadProjects();
    renderHome();
  }

  function loadProjects() {
    const saved = localStorage.getItem('am_projects');
    projects = saved ? JSON.parse(saved) : [{ id: '1', name: 'Proyecto 01', date: 'Hoy' }];
  }

  function saveProjects() {
    localStorage.setItem('am_projects', JSON.stringify(projects));
  }

  function renderHome() {
    const grid = document.getElementById('projects-grid');
    grid.innerHTML = '';
    projects.forEach(p => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.onclick = () => openProject(p);
      card.innerHTML = `
        <div class="project-thumb">PREVIEW</div>
        <div class="project-name">${p.name}</div>
      `;
      grid.appendChild(card);
    });
  }

  function createNewProject() {
    const newProj = {
      id: Date.now().toString(),
      name: `Proyecto ${projects.length + 1}`,
      date: 'Ahora'
    };
    projects.push(newProj);
    saveProjects();
    openProject(newProj);
  }

  function openProject(p) {
    currentProject = p;
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('editor-screen').style.display = 'flex';
    document.getElementById('project-title-display').innerText = p.name;
    resizeCanvas();
  }

  function exitToHome() {
    pause();
    document.getElementById('editor-screen').style.display = 'none';
    document.getElementById('home-screen').style.display = 'flex';
    renderHome();
  }

  function resizeCanvas() {
    const wrapper = document.getElementById('canvas-wrapper');
    const container = document.querySelector('.preview-container');
    const h = container.clientHeight - 20;
    const w = (h * 9) / 16;
    wrapper.style.width = `${w}px`;
    wrapper.style.height = `${h}px`;
    canvas.width = w * 2;
    canvas.height = h * 2;
    bufferCanvas.width = canvas.width;
    bufferCanvas.height = canvas.height;
  }

  function triggerFileInput() {
    document.getElementById('file-input').click();
  }

  function handleFileSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
    video.onloadedmetadata = () => {
      duration = video.duration;
      renderTimelineClip(file.name);
      renderFrame();
    };
  }

  function renderTimelineClip(name) {
    const track = document.getElementById('video-track');
    track.innerHTML = '';
    const clip = document.createElement('div');
    clip.className = 'clip active';
    clip.style.width = `${Math.max(duration * 40, 200)}px`;
    clip.innerText = name;
    track.appendChild(clip);
  }

  function togglePlay() {
    if (!video.src) return;
    if (isPlaying) pause(); else play();
  }

  function play() {
    isPlaying = true;
    document.getElementById('play-btn').innerText = 'PAUSE';
    video.playbackRate = clipData.speed;
    video.play();
    loop();
  }

  function pause() {
    isPlaying = false;
    document.getElementById('play-btn').innerText = 'PLAY';
    video.pause();
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
  }

  function loop() {
    if (!isPlaying) return;
    renderFrame();
    updateTimeDisplay();
    animationFrameId = requestAnimationFrame(loop);
  }

  function renderFrame() {
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (video.videoWidth) {
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(clipData.scale, clipData.scale);
      ctx.rotate((clipData.rotate * Math.PI) / 180);

      ctx.filter = `blur(${clipData.blur}px) brightness(${clipData.brightness}%) contrast(${clipData.contrast}%)`;

      if (clipData.speed < 1.0) {
        bufferCtx.globalAlpha = 0.4;
        bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
        ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        ctx.globalAlpha = 0.3;
        ctx.drawImage(bufferCanvas, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
      } else {
        ctx.drawImage(video, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        bufferCtx.globalAlpha = 1.0;
        bufferCtx.drawImage(video, 0, 0, bufferCanvas.width, bufferCanvas.height);
      }
    }
    ctx.restore();

    shapes.forEach(s => {
      ctx.save();
      ctx.fillStyle = '#3b82f6';
      if (s.type === 'rect') {
        ctx.fillRect(canvas.width / 4, canvas.height / 4, canvas.width / 2, canvas.height / 4);
      } else if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 80, 0, Math.PI * 2);
        ctx.fill();
      } else if (s.type === 'text') {
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('TEXTO', canvas.width / 2, canvas.height / 2);
      }
      ctx.restore();
    });
  }

  function updateTimeDisplay() {
    const cur = video.currentTime;
    const mins = Math.floor(cur / 60).toString().padStart(2, '0');
    const secs = Math.floor(cur % 60).toString().padStart(2, '0');
    const ms = Math.floor((cur % 1) * 100).toString().padStart(2, '0');
    document.getElementById('time-display').innerText = `${mins}:${secs}.${ms}`;
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
  }

  function updateSpeed() {
    const val = parseFloat(document.getElementById('speed-slider').value);
    clipData.speed = val;
    document.getElementById('speed-val').innerText = `${val.toFixed(2)}x`;
    if (isPlaying) video.playbackRate = val;
  }

  function updateEffects() {
    clipData.blur = document.getElementById('effect-blur').value;
    clipData.brightness = document.getElementById('effect-brightness').value;
    clipData.contrast = document.getElementById('effect-contrast').value;
    renderFrame();
  }

  function updateTransform() {
    clipData.scale = parseFloat(document.getElementById('transform-scale').value);
    clipData.rotate = parseFloat(document.getElementById('transform-rotate').value);
    renderFrame();
  }

  function addShape(type) {
    shapes.push({ type });
    renderFrame();
  }

  function addText() {
    shapes.push({ type: 'text' });
    renderFrame();
  }

  function splitClip() { alert("Clip separado."); }
  function deleteClip() { video.src = ""; shapes = []; document.getElementById('video-track').innerHTML = ""; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  function duplicateClip() { alert("Clip duplicado."); }
  function exportVideo() { alert("Exportando..."); }

  window.addEventListener('resize', resizeCanvas);
  window.onload = init;
</script>
</body>
</html>
